<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archeion</title>
  <link rel="shortcut icon" href="imgs/logo/archeion-icon.png" type="image/x-icon" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="profile-edit.css">

  <script src="script.js"></script>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-md fixed-top bg-body py-3" style="border-bottom:1px solid rgb(171,171,171)">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="imgs/logo/archeion-logo.png" width="82" height="22" alt="Archeion">
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navcol-2">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse small pe-5" id="navcol-2">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link pe-5" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link pe-4" href="#">Browse</a></li>
          <li class="nav-item"><a class="nav-link pe-4" href="#">Similarity Check</a></li>
          <li class="nav-item"><a class="nav-link pe-4" href="#">Trends</a></li>
          <li class="nav-item"><a class="nav-link pe-4" href="#">My Profile</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main -->
  <main class="profile-edit-main">
    <div class="container">

      <h1 class="h1-browse-title text-center mb-4">Edit Info</h1>

      <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
          <div class="card profile-edit-card">
            <div class="card-body">

              <form>
                <div class="row g-3">

                  <!-- Full Name & Username -->
                  <div class="col-md-6">
                    <div class="form-group">
                      <label for="fullname">Full Name</label>
                      <input type="text" class="form-control" id="fullname" value="Anjela Alexene de Jesus">
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="form-group">
                      <label for="username">Username</label>
                      <input type="text" class="form-control" id="username" value="anjelaccs">
                    </div>
                  </div>

                  <!-- Email -->
                  <div class="col-12">
                    <div class="form-group">
                      <label for="email">Email</label>
                      <input type="email" class="form-control" id="email" value="aa.dejesus00065@student.tsu.edu.ph">
                    </div>
                  </div>

                  <!-- Password (current + new) -->
                  <div class="col-12">
                    <div class="form-group">
                      <label>Password</label>

                      <div class="input-group mb-3">
                        <input
                          type="password"
                          class="form-control"
                          id="current-password"
                          placeholder="Enter current password">
                        <span
                          class="input-group-text bg-white border-start-0"
                          onclick="togglePass('current-password', this)"
                          style="cursor:pointer;">
                          <i class="bi bi-eye"></i>
                        </span>
                      </div>

                      <div class="input-group">
                        <input
                          type="password"
                          class="form-control"
                          id="new-password"
                          placeholder="Enter new password">
                        <span
                          class="input-group-text bg-white border-start-0"
                          onclick="togglePass('new-password', this)"
                          style="cursor:pointer;">
                          <i class="bi bi-eye"></i>
                        </span>
                      </div>

                    </div>
                  </div>

                  <!-- Action Buttons -->
                  <div class="col-12 mt-4">
                    <div class="d-grid gap-3 col-md-5 mx-auto">
                      <a href="profile.html" class="btn admin-cancel-btn w-100">Cancel</a>
                      <button type="submit" class="btn admin-save-btn w-100">Save Changes</button>
                    </div>
                  </div>

                </div>
              </form>

            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer mt-auto">
    <div class="container">
      <div class="footer-inner">
        <span class="footer-copy">© 2026 Archeion</span>
        <span class="footer-brand">Tarlac State University – CCS</span>
        <div class="footer-links">
          <a href="#">About Us</a>
          <a href="#">Contact Us</a>
          <a href="#">Terms of Service</a>
          <a href="#">Privacy Policy</a>
        </div>
      </div>
    </div>
  </footer>

</body>
</html>
