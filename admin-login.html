<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archeion – Admin Dashboard</title>
    <link rel="shortcut icon" href="imgs/logo/archeion-icon.png" type="image/x-icon" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=MuseoModerno:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="admin-style.css" />
  </head>

  <body class="admin-body d-flex align-items-center justify-content-center min-vh-100">
    <main class="admin-login-main d-flex align-items-center justify-content-center w-100 p-4">

      <div class="admin-card">

        <!-- Logo -->
        <div class="text-center mb-1">
          <img src="imgs/logo/archeion-logo.png" alt="Archeion" class="admin-logo" />
        </div>

        <!-- Subtitle -->
        <p class="admin-subtitle text-center mb-4">Administrator Dashboard</p>

        <!-- Form -->
        <form class="d-flex flex-column">

          <div class="form-group mb-3">
            <label for="adminUsername">Username</label>
            <input type="text" class="form-control" id="adminUsername" placeholder="Enter your username" autocomplete="username" />
          </div>

          <div class="form-group mb-2">
            <label for="adminPassword">Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="adminPassword" placeholder="Password" autocomplete="current-password" />
              <span class="input-group-text bg-white border-start-0" onclick="togglePass('adminPassword', this)" style="cursor:pointer;">
                <i class="bi bi-eye"></i>
              </span>
            </div>
          </div>

          <button type="submit" class="btn login-btn mt-3">Sign in</button>

        </form>

      </div>

    </main>

    <script>
      function togglePass(inputId, span) {
        const input = document.getElementById(inputId);
        const icon = span.querySelector('i');
        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
      }
    </script>
  </body>
</html>
