    rel="stylesheet" />

</head>

<body>
  <nav class="navbar navbar-expand-md fixed-top bg-body mb-6 py-3" style="border-bottom: 1px solid rgb(171,171,171) ;">
    <div class="container"><a class="navbar-brand d-flex align-items-center" href="#"><span></span><img
          src="imgs/logo/archeion-logo.png" width="82" height="22"></a><button class="navbar-toggler"
        data-bs-toggle="collapse" data-bs-target="#navcol-2"><span class="visually-hidden">Toggle navigation</span><span
          class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse small ms-0 ps-0 me-0 pe-5 mt-0" id="navcol-2">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link pe-5" href="#">Home</a></li>
          <li class="nav-item pe-4"><a class="nav-link  pe-4" href="#">Browse</a></li>
          <li class="nav-item pe-4"><a class="nav-link pe-4" href="#">Similarity Check</a></li>
          <li class="nav-item pe-4"><a class="nav-link pe-4" href="#">Trends</a></li>
          <li class="nav-item pe-4"><a class="nav-link pe-4" href="#">My
              Profile</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="login-main mt-50">
    <div class="d-flex justify-content-center align-items-center w-100">
      <div class="login-card" style="max-width: 420px; width: 100%;">

        <div class="login-greet mb-4 text-center">
          <h1 class="h1-login">Reset Password</h1>
          <p class="p-login-sub">Enter your new password.</p>

          <div class="alert alert-danger login-alert d-none" id="infoError" role="alert">
            <i class="bi bi-exclamation-circle-fill me-2"></i>
            <span id="infoErrorMsg"></span>
          </div>


        </div>

        <form class="d-flex flex-column">

          <div class="form-group mb-3">
            <label class="form-label" for="newPassword">Password <span class="text-danger">*</span></label>
            <div class="input-group">
              <input type="password" class="form-control" id="password" placeholder="Password">
              <span class="input-group-text bg-white border-start-0" onclick="togglePass('password', this)"
                style="cursor:pointer;">
                <i class="bi bi-eye"></i>
              </span>
            </div>
          </div>

          <div class="form-group mb-4">
            <label class="form-label" for="confirmPassword">Confirm Password
              <span class="text-danger">*</span></label>
            <div class="input-group">
              <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password">
              <span class="input-group-text bg-white border-start-0" onclick="togglePass('confirmPassword', this)"
                style="cursor:pointer;">
                <i class="bi bi-eye"></i>
              </span>
            </div>
          </div>

          <button type="submit" class="btn login-btn" id="resetPass">Reset Password</button>

        </form>

      </div>
    </div>
  </main>

  <footer class="footer mt-auto">
    <div class="container">
      <div class="footer-inner">

        <span class="footer-copy">© 2026 Archeion</span>

        <span class="footer-brand">Tarlac State University – CCS</span>

        <div class="footer-links">
          <a href="#">About Us</a>
          <a href="#">Contact Us</a>
          <a href="#">Terms of Service</a>
          <a href="#">Privacy Policy</a>
        </div>

      </div>
    </div>
  </footer>

</body>

</html>
