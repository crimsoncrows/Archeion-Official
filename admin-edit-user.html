<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archeion – Edit User</title>
    <link rel="shortcut icon" href="imgs/logo/archeion-icon.png" type="image/x-icon" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=MuseoModerno:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="admin-page d-flex">

    <!-- Sidebar -->
    <aside class="admin-sidebar d-flex flex-column">
      <img src="imgs/logo/archeion_light.png" alt="Archeion" class="admin-sidebar-logo" />

      <nav class="nav flex-column gap-2 flex-grow-1">
        <a class="admin-nav-link" href="admin-dashboard.html">
          <i class="bi bi-house-door-fill"></i> Dashboard
        </a>
        <a class="admin-nav-link active" href="admin-users.html">
          <i class="bi bi-people-fill"></i> Users
        </a>
        <a class="admin-nav-link" href="#">
          <i class="bi bi-file-earmark-text-fill"></i> Research
        </a>
        <a class="admin-nav-link" href="#">
          <i class="bi bi-star-fill"></i> Feedback
        </a>
      </nav>

      <button class="admin-logout-btn" type="button">Logout</button>
    </aside>

    <!-- Main content -->
    <main class="admin-main">

      <!-- Header -->
      <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
          <h1 class="admin-title mb-1">Manage User</h1>
          <p class="admin-welcome mb-0">Currently editing: <strong>001</strong></p>
          <p class="admin-welcome mb-0">You can only edit the role as an admin.</p>
        </div>
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-person-circle admin-avatar"></i>
          <span class="admin-username">admin1</span>
        </div>
      </div>

      <!-- Edit form -->
      <form class="d-flex flex-column" style="max-width: 600px;">

        <div class="row g-3 mb-3">
          <div class="form-group col-md-6">
            <label for="editFullName">Full Name</label>
            <input type="text" class="form-control" id="editFullName" value="Juan dela Cruz" readonly />
          </div>
          <div class="form-group col-md-6">
            <label for="editUsername">Username</label>
            <input type="text" class="form-control" id="editUsername" value="juandelacruz" readonly />
          </div>
        </div>

        <div class="form-group mb-3">
          <label for="editEmail">Email</label>
          <input type="email" class="form-control" id="editEmail" value="jdcruz222@student.tsu.edu.ph" readonly />
        </div>

        <div class="form-group mb-2">
          <label for="editRole">Role</label>
          <select class="form-select admin-role-select" id="editRole">
            <option selected>Student</option>
            <option>Faculty</option>
          </select>
        </div>

        <p class="admin-role-note mb-4">The default role for user is Student. Assignment of Faculty as role is manually set by the administrator.</p>

        <div class="d-flex gap-3">
          <a href="admin-users.html" class="btn admin-cancel-btn">Cancel</a>
          <button type="submit" class="btn admin-save-btn">Save Changes</button>
        </div>

      </form>

    </main>

  </body>
</html>
